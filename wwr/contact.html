<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matheus Luz Rodrigues's BYU-Idaho WWD 130 course WWR Rafting">
    <meta name="author" content="Matheus Luz Rodrigues">
    <title>Contact Us | Rafting Splash</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="contact-page">
    <header>
        <img src="images/z-splash.png" alt="Rafting Company's Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Rafting Splash</h1>

        <p>
            123 Main River Street<br>
            Kolob, California<br>
            +1 999 999 9999<br>
            info@whitewate.com
        </p>

        <!-- CONTACT GRID SECTION -->
        <section class="contact-container">

            <div class="map-box">
                <img src="images/map.jpg" alt="Map-Placeholder">
            </div>

            <form class="contact-form">

                <div class="grid-container">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder">

                    <p class="label-title">Message Purpose</p>

                    <div class="message-purpose-options">
                        <label class="radio-label" for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general">
                            General Inquiry
                        </label>

                        <label class="radio-label" for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label class="radio-label" for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </div>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>


                <label class="checkbox-label" for="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    Please Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>

        </section>

        <!-- EMPLOYEES SECTION MOVED DOWN -->
        <section class="employes-container">
            <h2>We Are Here to Serve You</h2>

            <div class="employes-images">
                <figure>
                    <img src="images/russel.jpg" alt="Russel M. Nelson, the last prophet">
                    <figcaption>Russel M. Nelson</figcaption>
                </figure>
                <figure>
                    <img src="images/dallin.jpg" alt="Dallin H. Oaks, the current prophet">
                    <figcaption>Dallin H. Oaks</figcaption>
                </figure>
                <figure>
                    <img src="images/thomas.jpg" alt="Thomas S. Monson, an old prophet">
                    <figcaption>Thomas S. Monson</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2025 - Rafting Splash - Matheus Luz Rodrigues</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.svg" alt="Facebook Logo">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.svg" alt="Instagram Logo">
            </a>
            <a href="https://www.whatsapp.com">
                <img src="images/whatsapp.svg" alt="whatsapp Logo">
            </a>
        </nav>
    </footer>

</body>

</html>
