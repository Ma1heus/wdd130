<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matheus Luz Rodrigues's BYU-Idaho WWD 130 course WWR Rafting">
    <meta name="author" content="Matheus Luz Rodrigues">
    <title>About Us</title>

    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="Rafting Company's Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Rafting Splash</h1>
        <div class="contact-container">
            <div class="map-box">
                <img src="images/map.jpg" alt="Map-Placeholder">
            </div>

            <form class="contact-form">

                <div class="grid-container">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Placeholder">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Placeholder">
                    <p class="label-title">Message Purpose</p>
                    <div class="message-purpose-options">
                        <label class="radio-label">
                            <input type="radio" name="purpose" value="general">
                            General Inquiry
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </div>

                <label for="message">Message</label>
                <textarea id="message" placeholder="Type here"></textarea>

                <label class="checkbox-label">
                    <input type="checkbox" name="subscribe">
                    Please Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>

        </div>
    </main>

    <footer>
        <p>© 2025 - Rafting Splash - Matheus Luz Rodrigues</p>
        <nav class="socialmedia">
            <a href="www.facebook.com">
                <img src="images/facebook.svg" alt="Facebook Logo">
            </a>
            <a href="www.instagram.com">
                <img src="images/instagram.svg" alt="Instagram Logo">
            </a>
            <a href="www.whatsapp.com">
                <img src="images/whatsapp.svg" alt="whatsapp Logo">
            </a>
        </nav>
    </footer>

</body>


</html>
